<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The page styles both themes, so let the browser paint its own chrome
         to match instead of flashing white on a dark desktop. The script below
         narrows this to the theme in use. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The theme, set on <html> before anything paints, so a dark page never
         flashes light. The same rule as src/lib/theme.ts (theme.test.ts runs
         this script): a choice made with the header's switch, kept under
         "seek-fw:theme", wins; without one the page follows the system.
         Storage that throws counts as no choice. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('seek-fw:theme');
        } catch (e) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          var dark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = dark ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta !== null) meta.setAttribute('content', theme);
      })();
    </script>
    <title>Seek Thermal Firmware Toolkit</title>
    <meta
      name="description"
      content="Dump, decrypt and reflash Seek Thermal camera firmware over WebUSB."
    />
    <!-- The header's mark as the dark theme draws it: the lucide Thermometer in
         --primary on its tile (--primary at 10% over the header's --card at 60%
         over --background, a --primary 30% edge), the dark tokens of
         src/styles.css worked out to sRGB. Redrawn on a 32 px grid so the
         tube's walls fall on whole pixels at 16 and 32 px. -->

    />
